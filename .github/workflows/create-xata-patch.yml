name: Create Xata Patch Release

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Base version (e.g., v2.9.4) - leave empty to auto-detect'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (preview without creating tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-patch:
    name: Create Xata Patch Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create xata patch tag
        run: |
          CMD="./scripts/xata/create-xata-patch.sh"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          if [ -n "${{ inputs.base_version }}" ]; then
            CMD="$CMD --base ${{ inputs.base_version }}"
          fi

          echo "Running: $CMD"
          $CMD
